# yamllint disable rule:document-start

- defaults:
    link:
      create: true
    relink: true
    glob: true

- clean: ["~"]

- create:
    - ~/.config
    - ~/.ssh
    - ~/projects/web
    - ~/projects/games
    - ~/github
    - ~/sandbox
    - ~/interC
    - ~/media/pictures
    - ~/media/videos
    - ~/media/audio
    - ~/media/pictures/screenshots
    - ~/media/videos/screen-recordings
    - ~/.zfunc
    - ~/.local/share/pandoc/defaults
    - ~/.local/share/darkman

- link:
    ~/bin: bin/
    ~/.dotfiles: ""
    ~/.ssh/config: ssh-config
    ~/.agignore: .agignore
    ~/.zshrc: .zshrc
    ~/.Xresources: .Xresources
    ~/.Xdefaults: .Xdefaults
    ~/.xscreensaver: .xscreensaver
    ~/.config/godot/editor_settings-3.tres: godot/editor_settings-3.tres
    ~/.config/godot/editor_settings-4.tres: godot/editor_settings-4.tres
    ~/.local/share/pandoc/defaults/:
      glob: true
      path: pandoc/*
      relink: true
    ~/.local/share/darkman/:
      glob: true
      path: darkman/*
      relink: true
    ~/.vim/:
      glob: true
      path: vim/*
      relink: true
    ~/.config/:
      glob: true
      path: config/*
      relink: true

- shell:
    - command: mkdir -p ${XDG_CONFIG_HOME:=$HOME/.config}
      description: Creating nvim config folder
    - command: [git submodule update --init --recursive]
      description: Installing/updating submodules
