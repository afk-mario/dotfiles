# Route iPad (pro.afk) Bluetooth playback to VirtualSink, not the default speakers.
# Uses monitor.bluez.rules so target.object is set at bluez_input node creation
# (stream.rules only affect restore logic and do not set live link targets).
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_input.B8_37_4A_E4_2C_86.*"
      }
    ]
    actions = {
      update-props = {
        target.object = "VirtualSink"
        node.dont-fallback = true
        state.restore-target = false
      }
    }
  }
]
