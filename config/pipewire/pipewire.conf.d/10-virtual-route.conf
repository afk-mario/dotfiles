# Virtual Sink → Virtual Source for app-isolated audio (OBS, Kenku FM, etc.)
# Play into Virtual Sink; record from Virtual Source. Speakers stay separate.
# Helvum will not show a cable between them — the loopback copies audio internally.

context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      audio.position = [ FL FR ]
      capture.props = {
        media.class = Audio/Sink
        node.name = "VirtualSink"
        node.description = "Virtual Sink"
        node.nick = "Virtual Sink"
      }
      playback.props = {
        media.class = Audio/Source
        node.name = "VirtualSource"
        node.description = "Virtual Source"
        node.nick = "Virtual Source"
      }
    }
  }
]
